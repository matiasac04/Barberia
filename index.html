<!doctype html>
<!--
  index.html — el ÚNICO archivo HTML de la app (Vite es una SPA: no hay
  otras páginas, todo se renderiza con React dentro de #root).

  ¿CÓMO FUNCIONA?
  Al abrir la app, el navegador lee este HTML, que está VACÍO de contenido
  real: solo tiene un <div id="root"></div> vacío. Después el <script>
  carga main.jsx, que es quien mete toda la interfaz adentro con React.

  Lo que hay en el <head> son metadatos para el navegador y los buscadores:
  - <meta charset>           → interpreta bien los acentos (español rioplatense)
  - viewport                 → que se vea bien en celular (sin zoom forzado)
  - description / title      → cómo aparece la app en Google y en la pestaña
  - theme-color              → el color de la barra del navegador en Android
  - preconnect + Google Fonts → carga las tipografías (Outfit y Playfair
                               Display). El preconnect abre la conexión antes
                               de pedir la fuente, para que aparezca más rápido.
  - <link rel="icon">        → el ícono de la pestaña (favicon.png)

  OJO: React se encarga del <body>. No se escribe HTML de la app acá; todo
  vive en los componentes JSX.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Qué cortecito · Reservá tu turno online con profesionales y servicios." />
    <meta name="theme-color" content="#0d0a06" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap"
      rel="stylesheet"
    />
    <title>Qué cortecito · Turnero</title>
  </head>
  <body>
    <!-- Punto de montaje: React reemplaza este div vacío por toda la app. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
